name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv sync --locked --all-groups
      - name: Check the data (mass balance, cross-border shares, hubs and areas)
        run: uv run pytest -q
      - name: Build the story with SubScout (fails on errors; warnings fail below)
        run: uv run subscout build . --out _site
      - name: No build warnings (untraced numbers, unused metrics, arc beats)
        run: python3 -c 'import json,sys;w=json.load(open("_site/build-report.json"))["warnings"];print("\n".join(w));sys.exit(1 if w else 0)' 
      - name: Print-grade plates for the export figures (PDF at A3 and A1, PNG; Plate, headless Chromium)
        run: |
          uv run playwright install --with-deps chromium
          uv run plate render _site --size a3-landscape --size a1-landscape --dpi 150 --density rich --legend rail --all-states --format pdf --format png --out _site/plates
          uv run python scripts/build_plates_index.py _site
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
